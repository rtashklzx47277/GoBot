services:
  mydb:
    image: mariadb:latest
    container_name: mydb
    env_file:
      - .env
    volumes:
      - ./backup:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql
    ports:
      - 4450:3306
    command: --innodb_flush_log_at_trx_commit=2
    networks:
      - bot-net
    restart: always
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 3s
  gobot:
    image: golang:alpine
    container_name: gobot
    working_dir: /bot
    env_file:
      - .env
    volumes:
      - ./bot:/bot
    command: go run .
    networks:
      - bot-net
    depends_on:
      mydb:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "go", "run", ".", "-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s
networks:
  bot-net:
    driver: bridge
volumes:
  db-data:
